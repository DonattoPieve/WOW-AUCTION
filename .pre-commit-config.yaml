# Instale uma vez com:  pip install pre-commit && pre-commit install
# A partir daí o commit roda as mesmas checagens do CI, mas só nos arquivos
# que mudaram — segundos em vez de minutos.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^backend/
        additional_dependencies: [fastapi, httpx]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      # Impede que um .env com credencial entre no repositório por descuido.
      - id: detect-private-key
      - id: check-merge-conflict
