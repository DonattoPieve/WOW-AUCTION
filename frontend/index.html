<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Preços e histórico das commodities da Auction House do World of Warcraft."
    />
    <meta name="theme-color" content="#8a5e17" />
    <title>AH Prices</title>

    <!-- Lê o tema salvo antes do primeiro pixel: sem isso a página pisca branca
       para quem escolheu escuro. É a única linha de script inline do projeto. -->
    <script>
      try {
        const t = localStorage.getItem("tema");
        if (t) document.documentElement.dataset.theme = t;
      } catch {
        /* modo privado: fica no tema do sistema */
      }
    </script>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%238a5e17'/><circle cx='16' cy='16' r='9' fill='%23d0a250'/></svg>"
    />
    <link rel="stylesheet" href="css/index.css" />

    <!--
      Tooltip do Wowhead.

      O Wowhead NAO publica uma API de dados: o que existe e este script de
      embed, documentado em https://www.wowhead.com/tooltips. Ele varre os
      links para wowhead.com/item=ID e anexa o tooltip do jogo - icone, cor de
      qualidade, tipo e o texto de sabor do item.

      Roda no navegador de quem visita e nao passa pelo nosso backend, entao
      nao substitui a Battle.net API: o nome e o icone que o banco guarda
      continuam vindo de la (backend/app/blizzard.py). O script enriquece a
      leitura; a ingestao nao depende dele.

      iconizeLinks fica desligado porque o icone ja e nosso, na coluna da
      tabela; ligado, sairiam dois icones lado a lado.
    -->
    <script>
      const whTooltips = {
        colorLinks: false,
        iconizeLinks: false,
        renameLinks: false,
      };
    </script>
    <script src="https://wow.zamimg.com/js/tooltips.js" defer></script>
  </head>
  <body>
    <nav>
      <a href="#" class="marca">AH Prices</a>

      <div class="busca-caixa">
        <label class="sr-only" for="busca">Buscar item</label>
        <input
          id="busca"
          type="search"
          autocomplete="off"
          placeholder="Buscar item (pt ou en)..."
          role="combobox"
          aria-expanded="false"
          aria-controls="resultados"
        />
        <div id="resultados" class="resultados" role="listbox" hidden></div>
      </div>

      <span id="realm" class="realm" title="Realm fixado"></span>

      <button id="tema" type="button" aria-label="Alternar tema claro e escuro">
        Tema
      </button>
    </nav>

    <main id="app"><p class="muted">Carregando...</p></main>

    <footer>
      <p class="muted">
        Dados da Auction House via Battle.net API ·
        <a href="/docs">documentação da API</a>
      </p>
      <p class="muted pequeno">
        Projeto pessoal, sem vínculo com a Blizzard Entertainment. World of
        Warcraft e Battle.net são marcas da Blizzard Entertainment, Inc.
      </p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
