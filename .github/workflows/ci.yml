name: ci

# Roda em todo push e em todo PR. Ao contrário do `release.yml`, que só dispara
# em tag: checagem é rápida e barata, então quanto mais cedo quebrar, melhor.
#
# A ordem dos passos é deliberada — do mais rápido para o mais lento. O lint
# leva segundos e pega erro de digitação; a suíte leva um minuto. Falhar no
# barato primeiro devolve o resultado antes de gastar o runner inteiro.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um PR que recebe três pushes seguidos não precisa de três execuções: a nova
# cancela a anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 é o piso declarado no pyproject; 3.13 é para descobrir quebra de
        # versão nova antes de precisar atualizar com pressa.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar o projeto e as ferramentas de dev
        run: pip install -e ".[dev]"

      - name: O lint passa?
        run: ruff check .

      - name: A formatação está aplicada?
        run: ruff format --check .

      - name: Os tipos fecham?
        run: mypy backend/app

      - name: A suíte passa?
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # Só do 3.11: dois uploads do mesmo relatório viram ruído no Codecov.
      - name: Guardar a cobertura
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Não há build no frontend — é JS de módulo nativo servido como está.
      # O que dá para checar sem bundler é sintaxe e formatação, e é o que roda.
      - name: Instalar o checador
        run: npm install --no-save prettier@3

      - name: A formatação do frontend está aplicada?
        run: npx prettier --check "frontend/**/*.{js,css,html}"

      - name: Os módulos são JS válido?
        run: |
          for f in frontend/js/*.js; do
            node --input-type=module --check < "$f" || exit 1
          done

  ponta-a-ponta:
    # Só depois que as duas metades passam: subir servidor e navegador é o passo
    # mais caro do arquivo e não faz sentido se o lint já quebrou.
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar o projeto
        run: pip install -e ".[dev]"

      - name: Instalar o Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Popular o banco de teste
        run: python -m backend.app.semente --dias 40
        env:
          WOW_DB_PATH: ci.db

      - name: As duas telas respondem?
        run: node scripts/ponta-a-ponta.mjs
        env:
          WOW_DB_PATH: ci.db

      - name: Guardar as telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas
          path: telas/
          if-no-files-found: ignore
